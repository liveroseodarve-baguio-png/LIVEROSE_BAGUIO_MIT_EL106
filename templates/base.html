<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BAGUIO MIT EL106{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">PERFORMANCE INTEGRATION TASK (PIT) - MIT EL106</a>
            <div class="d-flex">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-light me-2">Dashboard</a>
                    <a href="{% url 'logout_ui' %}" class="btn btn-danger">Logout</a>
                {% else %}
                    <a href="{% url 'login_ui' %}" class="btn btn-outline-light me-2">Login</a>
                    <a href="{% url 'register_ui' %}" class="btn btn-success">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
